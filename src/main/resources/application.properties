quarkus.application.name=smart-model-service
quarkus.grpc.server.port=9000
quarkus.grpc.server.enable-reflection-service=true
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true
quarkus.otel.sdk.disabled=true
%prod.quarkus.otel.sdk.disabled=false
%test.quarkus.grpc.clients.smartmodel.host=localhost
%test.quarkus.grpc.clients.smartmodel.port=9001
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/smartmodel}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:smartmodel}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:smartmodel}
%prod.quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%prod.quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.datasource.jdbc.telemetry=true
quarkus.container-image.group=toggtrux
quarkus.container-image.name=smart-model-service
quarkus.container-image.tag=1.0.0
quarkus.kubernetes.replicas=1
quarkus.kubernetes.resources.requests.memory=256Mi
quarkus.kubernetes.resources.requests.cpu=250m
quarkus.kubernetes.resources.limits.memory=512Mi
quarkus.kubernetes.env.secrets=postgres-credentials
quarkus.kubernetes.env.vars.quarkus-datasource-jdbc-url=jdbc:postgresql://postgres:5432/smartmodel
quarkus.kubernetes.prometheus.generate-service-monitor=false
quarkus.kubernetes.externalize-init=false
